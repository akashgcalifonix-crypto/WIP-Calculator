<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Planning Tool</title>
    <!-- Bootstrap & SheetJS Libraries -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f0f2f5; padding-top: 30px; font-family: sans-serif; }
        .main-container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .nav-tabs .nav-link.active { font-weight: bold; border-top: 3px solid #0d6efd; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); z-index: 9999; text-align: center; padding-top: 20%; }
        .status-msg { margin-top: 10px; font-weight: 500; }
    </style>
</head>
<body>

<!-- Loading Spinner -->
<div id="loader" class="loading-overlay">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
    <h3 class="mt-3">Processing & Saving to Database...</h3>
    <p>Please wait, creating new tab in Google Sheets.</p>
</div>

<div class="main-container">
    <h2 class="text-center mb-4 text-primary fw-bold">Inventory & Production Planner</h2>

    <!-- TABS -->
    <ul class="nav nav-tabs mb-4" id="toolTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#uploadTab">1. Upload BOM (New Sheet)</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#sapTab">2. Upload SAP Stock</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#planTab">3. Production Plan & Download</button></li>
    </ul>

    <div class="tab-content">
        
        <!-- TAB 1: BOM UPLOAD -->
        <div class="tab-pane fade show active" id="uploadTab">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Model</label>
                    <select class="form-select" id="upModel" onchange="updateColors('up')"><option value="">Select Model</option></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Color</label>
                    <select class="form-select" id="upColor"><option value="">Select Color</option></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Product Type</label>
                    <select class="form-select" id="upProduct">
                        <option value="Earbuds">Earbuds</option>
                        <option value="Charging Case">Charging Case</option>
                        <option value="Neckband">Neckband</option>
                        <option value="Smartwatch">Smartwatch</option>
                    </select>
                </div>
                <div class="col-md-12">
                    <label class="form-label fw-bold">BOM Excel File</label>
                    <p class="text-muted small mb-1">Required Headers: <strong>Component</strong>, <strong>Item Desc</strong>, <strong>QPA</strong></p>
                    <input type="file" class="form-control" id="bomFile" accept=".xlsx, .csv">
                </div>
                <div class="col-12 text-end">
                    <button class="btn btn-primary btn-lg" onclick="processAndUploadBOM()">Upload BOM & Create Tab</button>
                </div>
            </div>
            <div id="bomMsg" class="status-msg"></div>
        </div>

        <!-- TAB 2: SAP UPLOAD -->
        <div class="tab-pane fade" id="sapTab">
            <div class="row">
                <div class="col-md-8">
                    <label class="form-label fw-bold">SAP Inventory File</label>
                    <input type="file" class="form-control" id="sapFile">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button class="btn btn-warning w-100" onclick="processSAP()">Load SAP Data</button>
                </div>
            </div>
            <div id="sapMsg" class="status-msg"></div>
        </div>

        <!-- TAB 3: PLANNING -->
        <div class="tab-pane fade" id="planTab">
            <div class="card bg-light border-0 p-3 mb-3">
                <div class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Select Model</label>
                        <select class="form-select" id="planModel" onchange="updateColors('plan')"><option value="">Select</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Select Color</label>
                        <select class="form-select" id="planColor"><option value="">Select</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">WIP Quantity</label>
                        <input type="number" class="form-control" id="wipQty" placeholder="How many to make?">
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button class="btn btn-success w-100 fw-bold" onclick="calculatePlan()">Calculate Shortage</button>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 id="planTitle">Result</h5>
                <button class="btn btn-dark btn-sm" onclick="downloadExcel()">Download Excel Report</button>
            </div>

            <div class="table-responsive" style="max-height: 500px; overflow-y: auto;">
                <table class="table table-bordered table-striped table-hover small" id="resultTable">
                    <thead class="table-dark sticky-top">
                        <tr>
                            <th>Component (Part Code)</th>
                            <th>Item Desc (Name)</th>
                            <th>QPA</th>
                            <th>Total Required</th>
                            <th>SAP Stock</th>
                            <th>Difference</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" class="text-center text-muted">Select Model & Qty to see results</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<!-- JS Libraries -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

 Gen 2|Moon White", "Ad Ace Gen 2|Mystic Blue", "HMD S60|Grey", "HMD S60|Purple", "HMD P50|Black", "HMD P50|White", "HMD P50|Blue", "HMD X50|Black", "HMD X50|White", "HMD X50 Pro|Silver", "HMD X50 Pro|Blue", "HMD P70|Black", "HMD P70|White", "Amazon basics|Black", "Ad Prime 513 Anc|Carbon Black", "Ad Prime 513 Anc|Ivory Glow", "Ad Pulse|Shadow Black", "Ad 138 Gen 2|CarbonBlack", "Ad 138 Gen 2|Cream White", "Ad 701 Anc|Blue", "Ad 701 Anc|Grey", "Dashcam Hive E1|Black", "Dashcam Hive F1|Blue"
    ];

    const modelMap = {};
    rawModelList.forEach(item => {
        const [model, color] = item.split('|');
        if (!modelMap[model]) modelMap[model] = [];
        if (color) modelMap[model].push(color);
    });

    window.onload = function() {
        populateDropdown('upModel');
        populateDropdown('planModel');
    };

    function populateDropdown(id) {
        const select = document.getElementById(id);
        Object.keys(modelMap).sort().forEach(m => {
            const opt = document.createElement('option');
            opt.value = m;
            opt.text = m;
            select.appendChild(opt);
        });
    }

    function updateColors(prefix) {
        const model = document.getElementById(prefix + 'Model').value;
        const colorSelect = document.getElementById(prefix + 'Color');
        colorSelect.innerHTML = '<option value="">Select Color</option>';
        if (model && modelMap[model]) {
            modelMap[model].forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.text = c;
                colorSelect.appendChild(opt);
            });
        }
    }

    // --- 2. UPLOAD BOM (Creates New Tab) ---
    function processAndUploadBOM() {
        const model = document.getElementById('upModel').value;
        const color = document.getElementById('upColor').value;
        const fileInput = document.getElementById('bomFile');

        if(!model || !color || !fileInput.files[0]) {
            alert("Please select Model, Color and File");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.SheetNames[0];
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

            // --- HEADER MAPPING (Based on Screenshot) ---
            const rows = [];
            let headerMissing = false;

            jsonData.forEach(row => {
                // Mapping keys from your Screenshot
                let pCode = row['Component'] || row['Material'] || row['Part Code'];
                let pName = row['Item Desc'] || row['Description'] || row['Name'];
                let qpa = row['QPA'] || row['Quantity'] || row['Qty'];
                let mpn = row['MPN'] || ""; // Optional

                if (pCode && qpa !== undefined) {
                    rows.push({ partCode: pCode, partName: pName, qpa: parseFloat(qpa), mpn: mpn });
                }
            });

            if (rows.length === 0) {
                alert("Error: File mein headers match nahi hue. Please ensure columns 'Component', 'Item Desc', and 'QPA' exist.");
                return;
            }

            // Save to Current Memory (so we can plan immediately)
            currentBOM = rows; 

            // Send to Google Sheet
            sendToCloud({
                type: 'bom',
                model: model,
                color: color,
                rows: rows
            }, 'bomMsg');
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }

    // --- 3. UPLOAD SAP (Single Sheet) ---
    function processSAP() {
        const fileInput = document.getElementById('sapFile');
        if(!fileInput.files[0]) return alert("Select SAP File");

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.SheetNames[0];
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

            sapData = {};
            const rowsToSend = [];

            jsonData.forEach(row => {
                // Adjust SAP headers as needed
                let code = row['Part Code'] || row['Material'] || row['PartCode'];
                let qty = row['Stock'] || row['Unrestricted'] || row['Quantity'];
                
                if(code) {
                    let val = parseFloat(qty) || 0;
                    sapData[code] = val;
                    rowsToSend.push({partCode: code, stock: val});
                }
            });

            sendToCloud({ type: 'sap', rows: rowsToSend }, 'sapMsg');
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }

    // --- 4. CLOUD COMMUNICATION ---
    function sendToCloud(payload, msgId) {
        if(SCRIPT_URL.includes("YOUR_GOOGLE_SCRIPT")) {
            alert("Error: Script URL set nahi kiya hai! Code check karein.");
            return;
        }

        document.getElementById('loader').style.display = 'block';
        const msgEl = document.getElementById(msgId);
        msgEl.innerHTML = "";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Essential
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            msgEl.innerHTML = `<div class="alert alert-success">✅ Success! Data sent to Google Sheets.</div>`;
            
            // Auto switch to Plan tab if BOM
            if(payload.type === 'bom') {
                document.getElementById('planModel').value = payload.model;
                updateColors('plan');
                document.getElementById('planColor').value = payload.color;
            }
        })
        .catch(err => {
            document.getElementById('loader').style.display = 'none';
            alert("Error: " + err);
        });
    }

    // --- 5. CALCULATION LOGIC ---
    function calculatePlan() {
        const qty = parseFloat(document.getElementById('wipQty').value);
        if(!qty || currentBOM.length === 0) {
            alert("Ensure BOM is uploaded and WIP Qty is entered.");
            return;
        }

        const tbody = document.querySelector('#resultTable tbody');
        tbody.innerHTML = '';
        finalResults = [];

        currentBOM.forEach(item => {
            const req = item.qpa * qty;
            const stock = sapData[item.partCode] || 0;
            const diff = stock - req;

            finalResults.push({
                "Part Code": item.partCode,
                "Description": item.partName,
                "QPA": item.qpa,
                "Total Required": req,
                "SAP Stock": stock,
                "Difference": diff
            });

            const tr = `
                <tr>
                    <td>${item.partCode}</td>
                    <td>${item.partName || '-'}</td>
                    <td>${item.qpa}</td>
                    <td><strong>${req}</strong></td>
                    <td>${stock}</td>
                    <td class="${diff < 0 ? 'text-danger fw-bold' : 'text-success'}">${diff}</td>
                </tr>
            `;
            tbody.innerHTML += tr;
        });
        
        document.getElementById('planTitle').innerText = `Result for ${qty} Units`;
    }

    function downloadExcel() {
        if(finalResults.length === 0) return alert("No data to download");
        const ws = XLSX.utils.json_to_sheet(finalResults);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Shortage_Report");
        XLSX.writeFile(wb, "Production_Plan.xlsx");
    }
</script>
