<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Planner (Manual Map)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f4f7f6; padding-top: 20px; font-family: 'Segoe UI', sans-serif; }
        .container { max-width: 1400px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .table-responsive { max-height: 500px; overflow-y: auto; border: 1px solid #dee2e6; }
        thead th { position: sticky; top: 0; background: #212529; color: white; z-index: 1; }
        .row-running { background-color: #ffffff; }
        .row-alternate { background-color: #fff8e1; color: #8a6d3b; }
        .val-negative { color: #dc3545; font-weight: bold; }
        .val-positive { color: #198754; font-weight: bold; }
        .preview-table th, .preview-table td { font-size: 12px; padding: 4px; }
        .preview-box { background: #e9ecef; padding: 15px; border-radius: 8px; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div id="loader" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; text-align:center; padding-top:20%;">
    <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;"></div>
    <h3 class="mt-3">Processing...</h3>
</div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="text-primary fw-bold">Production Inventory Matcher</h2>
        <button class="btn btn-outline-secondary btn-sm" onclick="fetchUploadedList()">🔄 Refresh List</button>
    </div>

    <!-- TABS -->
    <ul class="nav nav-tabs nav-fill mb-4" id="mainTabs" role="tablist">
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab0">📊 Dashboard</button></li>
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab1">1. Upload BOM</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab2">2. Upload SAP Stock</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab3">3. Production Plan</button></li>
    </ul>

    <div class="tab-content">
        <!-- TAB 0: DASHBOARD -->
        <div class="tab-pane fade" id="tab0">
            <div class="list-group" id="uploadedList">
                <div class="text-center p-3">Loading...</div>
            </div>
        </div>
        
        <!-- TAB 1: UPLOAD BOM -->
        <div class="tab-pane fade show active" id="tab1">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="fw-bold">Model Name</label>
                    <input class="form-control" list="modelListOptions" id="upModel" placeholder="Type Model Name...">
                    <datalist id="modelListOptions"></datalist>
                </div>
                <div class="col-md-4">
                    <label class="fw-bold">Color</label>
                    <select class="form-select" id="upColor"><option value="">Select Color</option></select>
                </div>
                <div class="col-md-4">
                    <label class="fw-bold">Product Type</label>
                    <select class="form-select" id="upProduct"><option>Earbuds</option><option>Charging Case</option><option>Smartwatch</option></select>
                </div>
                <div class="col-12">
                    <label class="fw-bold">BOM Excel File</label>
                    <input type="file" class="form-control" id="bomFile">
                </div>
                <div class="col-12 text-center mt-3">
                    <button class="btn btn-primary btn-lg px-5" onclick="uploadBOM()">Upload BOM</button>
                </div>
            </div>
            <div id="bomMsg" class="mt-3 text-center fw-bold"></div>
        </div>

        <!-- TAB 2: UPLOAD SAP (MANUAL MAPPING) -->
        <div class="tab-pane fade" id="tab2">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <label class="fw-bold mb-2">SAP Inventory File</label>
                    <input type="file" class="form-control mb-3" id="sapFile" onchange="previewSAP(this)">
                    
                    <!-- PREVIEW BOX -->
                    <div id="sapPreviewBox" class="preview-box">
                        <h5 class="text-danger fw-bold">Manual Mapping (Select Correct Columns)</h5>
                        <p class="small text-muted">Niche table dekhein aur batayein ki Part Code aur Stock kis column mein hain.</p>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-5">
                                <label class="fw-bold">Part Code Column:</label>
                                <select id="sapColPart" class="form-select"></select>
                            </div>
                            <div class="col-md-5">
                                <label class="fw-bold">Stock Qty Column:</label>
                                <select id="sapColStock" class="form-select"></select>
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button class="btn btn-warning w-100 fw-bold" onclick="confirmSAPUpload()">Confirm & Load</button>
                            </div>
                        </div>

                        <div class="table-responsive bg-white border">
                            <table class="table table-sm table-bordered preview-table mb-0" id="sapPreviewTable">
                                <!-- JS will fill this -->
                            </table>
                        </div>
                    </div>

                </div>
            </div>
            <div id="sapMsg" class="mt-3 text-center fw-bold"></div>
        </div>

        <!-- TAB 3: CALCULATION -->
        <div class="tab-pane fade" id="tab3">
            <div class="card bg-light p-3 mb-3 border-0">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="fw-bold">Model</label>
                        <input class="form-control" list="modelListOptions" id="planModel" placeholder="Search Model...">
                    </div>
                    <div class="col-md-3">
                        <label class="fw-bold">Color</label>
                        <select class="form-select" id="planColor"><option value="">Select Color</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="fw-bold">WIP Quantity</label>
                        <input type="number" class="form-control" id="wipQty" placeholder="500">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success w-100 fw-bold" onclick="calculate()">Calculate</button>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 id="resTitle" class="m-0">Shortage Report</h5>
                <button class="btn btn-dark btn-sm" onclick="downloadExcel()">Download Excel</button>
            </div>
            
            <div class="table-responsive">
                <table class="table table-bordered table-hover" id="resTable">
                    <thead class="table-dark">
                        <tr>
                            <th style="width: 50px;">Prio</th>
                            <th>Part Code</th>
                            <th>Description</th>
                            <th>QPA</th>
                            <th>Required (0 & 1)</th>
                            <th>SAP Stock</th>
                            <th>Difference</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ⚠️⚠️ APNA GOOGLE SCRIPT URL YAHAN PASTE KAREIN ⚠️⚠️
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNx4R60zA1gMpg5rpJJR3UGzk0DQOyphbyYw2-0Rw4hnuA5wkKvW95dTo70OKUikEwTg/exec"; 

    // --- VARIABLES ---
    let currentBOM = []; 
    let sapData = {};    
    let sapRawData = []; // To hold data for manual mapping
    let finalResults = [];

    // --- SUPER CLEANER ---
    function cleanKey(val) {
        if(!val) return "";
        return String(val).replace(/[\s\u00A0]+/g, "").toUpperCase().trim();
    }

    // --- INITIALIZATION ---
    const rawModelList = ["Ad131|Black", "Ad 91|MistGrey", "Ad 800 Hidef|Graphite Grey"]; // Add more
    const modelMap = {};
    rawModelList.forEach(item => {
        const [model, color] = item.split('|');
        if (!modelMap[model]) modelMap[model] = [];
        if (color && !modelMap[model].includes(color)) modelMap[model].push(color);
    });

    window.onload = function() {
        populateDatalist();
        document.getElementById('upModel').addEventListener('input', () => updateColors('up'));
        document.getElementById('planModel').addEventListener('input', () => updateColors('plan'));
        fetchUploadedList();
    };

    function populateDatalist() {
        const list = document.getElementById('modelListOptions');
        list.innerHTML = '';
        Object.keys(modelMap).sort().forEach(m => list.appendChild(new Option(m, m)));
    }

    function updateColors(prefix) {
        const val = document.getElementById(prefix + 'Model').value;
        const sel = document.getElementById(prefix + 'Color');
        sel.innerHTML = '<option value="">Select Color</option>';
        if (modelMap[val]) modelMap[val].forEach(c => sel.add(new Option(c, c)));
        else sel.innerHTML = '<option value="">New Model Detected</option>';
    }

    function fetchUploadedList() {
        const listContainer = document.getElementById('uploadedList');
        fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(data => {
            if(!data || data.length === 0) return listContainer.innerHTML = '<div class="alert alert-warning">No BOMs found.</div>';
            let html = '';
            data.forEach(name => html += `<a href="#" class="list-group-item list-group-item-action">✅ ${name}</a>`);
            listContainer.innerHTML = html;
        });
    }

    // --- 1. UPLOAD BOM (Auto) ---
    function uploadBOM() {
        const model = document.getElementById('upModel').value;
        const color = document.getElementById('upColor').value;
        const fileInput = document.getElementById('bomFile');
        if(!model || !fileInput.files[0]) return alert("Select Model & File");

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});

            let cols = { partCode: -1, qpa: -1, desc: -1, priority: -1 };
            let startRow = 1;

            for(let i=0; i < Math.min(25, jsonData.length); i++) {
                const row = jsonData[i].map(x => String(x).toLowerCase().trim());
                if (row.some(c => c.includes("component") || c.includes("material"))) {
                    cols.partCode = row.findIndex(c => c.includes("component") || c.includes("material") || c.includes("item code"));
                    cols.qpa = row.findIndex(c => c === "qpa" || c.includes("qty"));
                    cols.priority = row.findIndex(c => c.includes("priority"));
                    cols.desc = row.findIndex(c => c.includes("description") || c.includes("desc"));
                    startRow = i + 1;
                    break;
                }
            }

            if(cols.partCode === -1) cols = { partCode: 2, qpa: 5, desc: 3, priority: 8 };

            currentBOM = [];
            for(let i = startRow; i < jsonData.length; i++) {
                let r = jsonData[i];
                if(r[cols.partCode]) {
                    let prio = 0;
                    if(cols.priority > -1 && r[cols.priority] !== undefined) prio = parseInt(r[cols.priority]) || 0;
                    currentBOM.push({
                        partCode: r[cols.partCode], 
                        cleanCode: cleanKey(r[cols.partCode]), 
                        partName: cols.desc > -1 ? r[cols.desc] : "",
                        qpa: parseFloat(r[cols.qpa]) || 0,
                        priority: prio
                    });
                }
            }
            sendToCloud({ type: 'bom', model: model, color: color, rows: jsonData }, 'bomMsg');
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }

    // --- 2. PREVIEW SAP (Manual Mapping Step) ---
    function previewSAP(input) {
        if(!input.files[0]) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            // Load ALL data
            sapRawData = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], {header: 1});
            
            // Show Preview UI
            document.getElementById('sapPreviewBox').style.display = 'block';
            const table = document.getElementById('sapPreviewTable');
            table.innerHTML = '';

            // Generate Headers for Select
            const colSelects = [document.getElementById('sapColPart'), document.getElementById('sapColStock')];
            colSelects.forEach(sel => sel.innerHTML = '<option value="-1">Select...</option>');

            // Render First 5 Rows
            for(let i=0; i < Math.min(5, sapRawData.length); i++) {
                let tr = document.createElement('tr');
                sapRawData[i].forEach((cell, idx) => {
                    let td = document.createElement(i===0 ? 'th' : 'td');
                    td.innerText = cell;
                    tr.appendChild(td);
                    
                    // Add column options (only once)
                    if(i === 0) {
                        colSelects.forEach(sel => {
                            let opt = new Option(`Col ${idx+1}: ${cell}`, idx);
                            sel.add(opt);
                        });
                    }
                });
                table.appendChild(tr);
            }
        };
        reader.readAsArrayBuffer(input.files[0]);
    }

    // --- 3. CONFIRM & LOAD SAP ---
    function confirmSAPUpload() {
        const cIdx = parseInt(document.getElementById('sapColPart').value);
        const sIdx = parseInt(document.getElementById('sapColStock').value);

        if(cIdx === -1 || sIdx === -1) return alert("Please select both Part Code and Stock columns!");

        sapData = {};
        let count = 0;

        // Start from row 1 (assuming row 0 is header)
        for(let i=1; i < sapRawData.length; i++) {
            let r = sapRawData[i];
            if(r[cIdx]) {
                let key = cleanKey(r[cIdx]); // Cleaning is key!
                let val = parseFloat(r[sIdx]) || 0;
                
                if(sapData[key]) sapData[key] += val;
                else sapData[key] = val;
                count++;
            }
        }

        document.getElementById('sapPreviewBox').style.display = 'none';
        alert(`Success! Loaded ${count} items from SAP based on your selection.`);
        sendToCloud({ type: 'sap', rows: sapRawData }, 'sapMsg');
    }

    function sendToCloud(payload, msgId) {
        if(SCRIPT_URL.includes("YOUR")) return alert("URL Missing!");
        document.getElementById('loader').style.display = 'block';
        fetch(SCRIPT_URL, {
            method: 'POST', mode: 'no-cors',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('loader').style.display = 'none';
            document.getElementById(msgId).innerHTML = `<div class="alert alert-success">✅ Data Saved</div>`;
            if(payload.type === 'bom') {
                document.getElementById('planModel').value = payload.model;
                if(!modelMap[payload.model]) { modelMap[payload.model] = [payload.color]; populateDatalist(); }
                updateColors('plan');
                fetchUploadedList();
            }
        });
    }

    function calculate() {
        const qty = parseFloat(document.getElementById('wipQty').value);
        if(!qty) return alert("Enter WIP Qty");
        if(currentBOM.length === 0) return alert("BOM missing");

        const tbody = document.querySelector('#resTable tbody');
        tbody.innerHTML = '';
        finalResults = [];

        currentBOM.forEach(item => {
            let requiredQty = 0;
            let isRunning = false;

            if(item.priority === 0 || item.priority === 1) {
                requiredQty = item.qpa * qty;
                isRunning = true;
            }

            // CLEAN KEY MATCHING
            const stock = sapData[item.cleanCode] || 0;
            const diff = stock - requiredQty;
            
            let diffClass = '';
            if(diff < 0) diffClass = 'val-negative'; 
            else if(diff >= 0 && isRunning) diffClass = 'val-positive';
            let rowClass = isRunning ? 'row-running' : 'row-alternate';

            finalResults.push({
                "Priority": item.priority,
                "Part Code": item.partCode,
                "Description": item.partName,
                "QPA": item.qpa,
                "Required Qty": requiredQty,
                "SAP Stock": stock,
                "Difference": diff
            });

            tbody.innerHTML += `
                <tr class="${rowClass}">
                    <td class="text-center fw-bold">${item.priority}</td>
                    <td>${item.partCode}</td>
                    <td>${item.partName}</td>
                    <td>${item.qpa}</td>
                    <td>${requiredQty}</td>
                    <td>${stock}</td>
                    <td class="${diffClass}">${diff}</td>
                </tr>
            `;
        });
    }

    function downloadExcel() {
        if(finalResults.length === 0) return alert("Calculate first");
        const ws = XLSX.utils.json_to_sheet(finalResults);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Shortage_Plan");
        XLSX.writeFile(wb, "Production_Shortage.xlsx");
    }
</script>
</body>
</html>
