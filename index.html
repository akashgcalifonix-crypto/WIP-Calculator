<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Planning Tool</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SheetJS Library for Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f4f7f6; padding-top: 20px; font-family: 'Segoe UI', sans-serif; }
        .main-card { max-width: 1200px; margin: 0 auto; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .nav-tabs .nav-link.active { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); z-index: 9999; text-align: center; padding-top: 15%; }
        .table-responsive { max-height: 600px; overflow-y: auto; }
        thead th { position: sticky; top: 0; background: #212529; z-index: 1; }
    </style>
</head>
<body>

<!-- Loader -->
<div id="loader" class="loading-overlay">
    <div class="spinner-border text-primary" style="width: 4rem; height: 4rem;" role="status"></div>
    <h3 class="mt-3">Processing...</h3>
    <p class="text-muted">Saving Data to Google Sheet & Creating Tab</p>
</div>

<div class="container main-card">
    <h2 class="text-center mb-4 fw-bold text-primary">Inventory Matcher & BOM Manager</h2>

    <!-- TABS -->
    <ul class="nav nav-tabs nav-fill mb-4" id="toolTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#uploadTab">1. Upload BOM (Create New Tab)</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#sapTab">2. Upload SAP Stock</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#planTab">3. Calculate & Download</button></li>
    </ul>

    <div class="tab-content">
        
        <!-- TAB 1: UPLOAD BOM -->
        <div class="tab-pane fade show active" id="uploadTab">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Model Name</label>
                    <select class="form-select" id="upModel" onchange="updateColors('up')"><option value="">Select Model</option></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Color</label>
                    <select class="form-select" id="upColor"><option value="">Select Color</option></select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Product Type</label>
                    <select class="form-select" id="upProduct">
                        <option value="Earbuds">Earbuds</option>
                        <option value="Charging Case">Charging Case</option>
                        <option value="Smartwatch">Smartwatch</option>
                    </select>
                </div>
                <div class="col-12">
                    <div class="alert alert-info py-2">
                        <small>Excel Headers Required: <strong>Component</strong>, <strong>Item Desc</strong>, <strong>QPA</strong></small>
                    </div>
                    <input type="file" class="form-control form-control-lg" id="bomFile" accept=".xlsx">
                </div>
                <div class="col-12 text-center mt-4">
                    <button class="btn btn-primary btn-lg px-5" onclick="processAndUploadBOM()">Upload BOM & Create Sheet</button>
                </div>
            </div>
            <div id="bomMsg" class="mt-3"></div>
        </div>

        <!-- TAB 2: UPLOAD SAP -->
        <div class="tab-pane fade" id="sapTab">
            <div class="row justify-content-center">
                <div class="col-md-8 text-center">
                    <label class="form-label fw-bold">SAP Inventory File</label>
                    <input type="file" class="form-control mb-3" id="sapFile">
                    <button class="btn btn-warning text-white px-5" onclick="processSAP()">Load SAP Data</button>
                </div>
            </div>
            <div id="sapMsg" class="mt-3"></div>
        </div>

        <!-- TAB 3: PLANNING -->
        <div class="tab-pane fade" id="planTab">
            <div class="card bg-light border-0 p-3 mb-3">
                <div class="row g-3 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Model</label>
                        <select class="form-select" id="planModel" onchange="updateColors('plan')"><option value="">Select</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">Color</label>
                        <select class="form-select" id="planColor"><option value="">Select</option></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-bold">WIP Quantity</label>
                        <input type="number" class="form-control" id="wipQty" placeholder="Qty to make">
                    </div>
                    <div class="col-md-3">
                        <button class="btn btn-success w-100 fw-bold" onclick="calculatePlan()">Calculate Shortage</button>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 id="resultTitle" class="m-0">Calculation Result</h5>
                <button class="btn btn-dark btn-sm" onclick="downloadExcel()">Download Report</button>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover" id="resultTable">
                    <thead class="table-dark">
                        <tr>
                            <th>Component</th>
                            <th>Description</th>
                            <th>QPA</th>
                            <th>Total Required</th>
                            <th>SAP Stock</th>
                            <th>Difference</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr><td colspan="6" class="text-center text-muted">No calculation yet.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // ==========================================
    // ⚠️ PASTE YOUR DEPLOYED GOOGLE URL HERE ⚠️

    // --- Global Variables ---
    let currentBOM = [];
    let sapData = {};
    let finalResults = [];

    // --- 1. CONFIGURATION: Model List ---
    const rawModelList = [

        "Ad138|Black", "Ad138|IvoryWhite", "Ad138|Blue", "Ad138|Green", "Ad 91|MistGrey", "Ad 91|Black", "Ad 91|Blue",

re Blue", "Ad 800 Hidef|Emerald Green", "Ad 131 Pro Buds|Active Black", "Ad 131 Pro Buds|Slate Blue", "Ad 131 Pro Buds|Coco Brown", "Ad 301|Sunset Blush", "Ad 301|Arctic Whisper", "Ad 301|Midnight Shadow", "Ad 301|Velvet Rouge", "Ad 131 Elite Anc|Active Black", "Ad 131 Elite Anc|Active White", "Ad 131 Elite Anc|Dawn Blue", "Ad 131 Elite Anc|ActiveTeal", "Ad Primo|Black", "Ad 181 Pro|Lilac Serenity", "Ad 181 Pro|Frosted Mint", "Ad 181 Pro|Coral Bloom", "Ad 181 Pro|Mocha Elegance", "Ad 191 Anc|Pellucid White", "Ad 191 Anc|Pellucid Orange", "Ad 191 Anc|Pellucid Green", "Ad 191 Anc|Pellucid Red", "Ad 191 Anc|Pellucid Blue", "Ad 280 Anc|Active Black", "Ad 280 Anc|Mint Blue", "Ad Unity ANC|Grey", "Ad Unity ANC|Black", "Ad Nirvana Iris|Black", "Ad Nirvana Iris|White", "Ad Nirvana X|Galactic Red", "Ad Nirvana X|Smoky Amethyst", "Ad Nirvana X|Mist Blue", "Ad Nirvana X|Cosmic Onyx", "Ad 91 Prime|Midnight Black", "Ad 91 Prime|Sonic Silver", "Ad 111v2|White", "Ad 111v2|Black", "Ad 280 Anc|Green", "Ad Ultra Pro|Zinc White", "Ad Ultra Pro|Gunmetal Black", "Ad Plus 311|Ash Grey", "Ad Plus 311|Charcoal Black", "Ad Plus 311|Crimsom Red", "Ad Plus 311|Midnight Blue", "Ad Plus 318|Active Black", "Ad Plus 318|StarryBlue", "Ad 213|Berry Blue", "Ad 213|Sandstone", "Ad 213|Shadow Black", "Ad 141 Gen 2|Active White", "Ad 141 Gen 2|Grey", "Ad 141 Gen 2|Active Black", "Ad 141 Gen 2|Orange", "Ad 141 Gen 2|Teal", "Ad 148 Gen 2|Active White", "Ad 148 Gen 2|Grey", "Ad 148 Gen 2|Orange", "Ad 148 Gen 2|Teal", "Ad 148 Gen 2|Active Black", "Ad 212|Ivory", "Ad 212|Noir Black", "Ad 212|Peach Blush", "Ad Prime 412|Lunar White", "Ad Prime 412|Midnight Black", "Ad Prime 412|Sahara Chic", "Ad 131 Gen 2|CarbonBlack", "Ad 131 Gen 2|Cream White", "Ad 131 Gen 2|Ice Blue", "Ad 313|CarbonBlack", "Ad 313|Gold Mist", "Ad 313|Jade Green", "HMD P60|Black", "HMD P60|White", "HMD P60|Green", "Ad Alpha Gen 2|Midnight Black", "Ad Alpha Gen 2|Slate Grey", "Ad Alpha Gen 2|Ocean Blue", "Ad Ace Gen 2|Shadow Black", "Ad Ace Gen 2|Moon White", "Ad Ace Gen 2|Mystic Blue", "HMD S60|Grey", "HMD S60|Purple", "HMD P50|Black", "HMD P50|White", "HMD P50|Blue", "HMD X50|Black", "HMD X50|White", "HMD X50 Pro|Silver", "HMD X50 Pro|Blue", "HMD P70|Black", "HMD P70|White", "Amazon basics|Black", "Ad Prime 513 Anc|Carbon Black", "Ad Prime 513 Anc|Ivory Glow", "Ad Pulse|Shadow Black", "Ad 138 Gen 2|CarbonBlack", "Ad 138 Gen 2|Cream White", "Ad 701 Anc|Blue", "Ad 701 Anc|Grey", "Dashcam Hive E1|Black", "Dashcam Hive F1|Blue"
    ];

    const modelMap = {};
    rawModelList.forEach(item => {
        const [model, color] = item.split('|');
        if (!modelMap[model]) modelMap[model] = [];
        // [FIXED] Prevent duplicate colors
        if (color && !modelMap[model].includes(color)) {
            modelMap[model].push(color);
        }
    });

    // Load Dropdowns
    window.onload = function() {
        populateDropdown('upModel');
        populateDropdown('planModel');
    };

    function populateDropdown(id) {
        const select = document.getElementById(id);
        Object.keys(modelMap).sort().forEach(m => {
            const opt = document.createElement('option');
            opt.value = m; opt.text = m; select.appendChild(opt);
        });
    }

    function updateColors(prefix) {
        const model = document.getElementById(prefix + 'Model').value;
        const colorSelect = document.getElementById(prefix + 'Color');
        colorSelect.innerHTML = '<option value="">Select Color</option>';
        if (model && modelMap[model]) {
            modelMap[model].forEach(c => {
                const opt = document.createElement('option');
                opt.value = c; opt.text = c; colorSelect.appendChild(opt);
            });
        }
    }

    // --- 2. UPLOAD BOM (Logic for Header Matching) ---
    function processAndUploadBOM() {
        const model = document.getElementById('upModel').value;
        const color = document.getElementById('upColor').value;
        const fileInput = document.getElementById('bomFile');

        if(!model || !color || !fileInput.files[0]) {
            alert("Select Model, Color and File first!");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.SheetNames[0];
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

            const rows = [];
            
            // Loop through each row
            jsonData.forEach(row => {
                // [FIXED] Remove spaces from Headers (e.g., "Component " -> "Component")
                let cleanRow = {};
                Object.keys(row).forEach(key => {
                    cleanRow[key.trim()] = row[key];
                });

                // Match with your Screenshot Columns
                let pCode = cleanRow['Component'] || cleanRow['Material'] || cleanRow['Part Code'];
                let pName = cleanRow['Item Desc'] || cleanRow['Description'] || cleanRow['Part Name'];
                let qpa = cleanRow['QPA'] || cleanRow['Quantity'] || cleanRow['Qty'];
                let mpn = cleanRow['MPN'] || ""; 

                if (pCode && qpa !== undefined) {
                    rows.push({ partCode: pCode, partName: pName, qpa: parseFloat(qpa), mpn: mpn });
                }
            });

            if (rows.length === 0) {
                alert("Error: Headers match nahi hue. Excel check karein ('Component', 'QPA').");
                return;
            }

            currentBOM = rows; // Save to local memory
            sendToCloud({ type: 'bom', model: model, color: color, rows: rows }, 'bomMsg');
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }

    // --- 3. UPLOAD SAP ---
    function processSAP() {
        const fileInput = document.getElementById('sapFile');
        if(!fileInput.files[0]) return alert("Select SAP File");

        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheet = workbook.SheetNames[0];
            const jsonData = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);

            sapData = {};
            const rowsToSend = [];

            jsonData.forEach(row => {
                let cleanRow = {};
                Object.keys(row).forEach(key => { cleanRow[key.trim()] = row[key]; });

                let code = cleanRow['Part Code'] || cleanRow['Material'] || cleanRow['PartCode'];
                let qty = cleanRow['Stock'] || cleanRow['Unrestricted'] || cleanRow['Quantity'];
                
                if(code) {
                    let val = parseFloat(qty) || 0;
                    sapData[code] = val;
                    rowsToSend.push({partCode: code, stock: val});
                }
            });

            sendToCloud({ type: 'sap', rows: rowsToSend }, 'sapMsg');
        };
        reader.readAsArrayBuffer(fileInput.files[0]);
    }

    // --- 4. CLOUD SYNC ---
    function sendToCloud(payload, msgId) {
        if(SCRIPT_URL.includes("YOUR_GOOGLE_SCRIPT")) {
            alert("Warning: URL Set nahi hai!");
            return;
        }

        document.getElementById('loader').style.display = 'block';
        const msgEl = document.getElementById(msgId);
        msgEl.innerHTML = "";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            document.getElementById('loader').style.display = 'none';
            msgEl.innerHTML = `<div class="alert alert-success">✅ Done! Data saved to Google Sheets.</div>`;
            
            // Auto-switch for BOM
            if(payload.type === 'bom') {
                document.getElementById('planModel').value = payload.model;
                updateColors('plan');
                document.getElementById('planColor').value = payload.color;
            }
        })
        .catch(err => {
            document.getElementById('loader').style.display = 'none';
            alert("Error: " + err);
        });
    }

    // --- 5. CALCULATION ---
    function calculatePlan() {
        const qty = parseFloat(document.getElementById('wipQty').value);
        if(!qty || currentBOM.length === 0) return alert("Enter WIP Qty & Ensure BOM is loaded.");

        const tbody = document.querySelector('#resultTable tbody');
        tbody.innerHTML = '';
        finalResults = [];

        currentBOM.forEach(item => {
            const req = item.qpa * qty;
            const stock = sapData[item.partCode] || 0;
            const diff = stock - req;

            finalResults.push({
                "Component": item.partCode,
                "Description": item.partName,
                "QPA": item.qpa,
                "Total Required": req,
                "SAP Stock": stock,
                "Difference": diff
            });

            tbody.innerHTML += `
                <tr>
                    <td>${item.partCode}</td>
                    <td>${item.partName || ''}</td>
                    <td>${item.qpa}</td>
                    <td>${req}</td>
                    <td>${stock}</td>
                    <td class="${diff < 0 ? 'text-danger fw-bold' : 'text-success'}">${diff}</td>
                </tr>
            `;
        });
        document.getElementById('resultTitle').innerText = `Shortage Report for ${qty} Units`;
    }

    function downloadExcel() {
        if(finalResults.length === 0) return alert("Calculate first!");
        const ws = XLSX.utils.json_to_sheet(finalResults);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "ShortageReport");
        XLSX.writeFile(wb, "Production_Plan.xlsx");
    }
</script>

</body>
</html>
